<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reeder 式图标对比</title>
<style>
:root {
  --bg: #F5F2F1; --card: #FFFFFF; --ink: #3A3A3A; --muted: #787878; --faint: #A3A0A1; --line: #E6E2E2;
  --icon: #5E5E5E; --danger: #E75C57; --pill: #E9E6E5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1C1C1C; --card: #262626; --ink: #D8D8D8; --muted: #8E8E8E; --faint: #6C6C6C; --line: #363636; --icon: #A8A8A8; --pill: #333333; }
}
:root[data-theme="dark"] { --bg: #1C1C1C; --card: #262626; --ink: #D8D8D8; --muted: #8E8E8E; --faint: #6C6C6C; --line: #363636; --icon: #A8A8A8; --pill: #333333; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "PingFang SC", system-ui, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 80px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 26px; font-weight: 650; margin: 0; letter-spacing: -0.3px; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 720px; }
h2 { font-size: 13px; font-weight: 650; letter-spacing: 1px; color: var(--muted); margin: 40px 0 12px; }
h3 { font-size: 15px; font-weight: 650; margin: 0 0 10px; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.toggle button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.refs { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.refs .strips { display: grid; gap: 8px; }
figure { margin: 0; background: #F7F5F4; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
figure img { display: block; width: 100%; height: auto; }
figcaption { font-size: 12px; color: #8a8a8a; padding: 4px 10px 6px; background: #F7F5F4; }
.rules { color: var(--muted); font-size: 14px; margin: 16px 0 0; padding-left: 20px; }
.rules li { margin: 3px 0; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.set .scenes { display: grid; gap: 10px; }
.set[data-set="reeder"] h3::after { content: " ←"; color: var(--faint); font-weight: 400; }
.scene { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px 10px; }
.scene .label { font-size: 12px; color: var(--faint); margin: 8px 0 4px; }
.scene .label:first-child { margin-top: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; color: var(--icon); padding: 8px 4px; }
.bar.top { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.bar svg { flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; background: var(--pill); border-radius: 999px; padding: 3px 10px; font-size: 10px; font-weight: 650; letter-spacing: .5px; color: var(--icon); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--pill); }
.row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
.row svg { color: var(--icon); flex: none; }
.row span { flex: 1; min-width: 0; }
.row.danger, .row.danger svg { color: var(--danger); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(236px, 100%), 1fr)); gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; height: 76px; border-radius: 10px; color: var(--icon); }
.slot.new { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.slot .tag { position: absolute; top: 4px; left: 8px; font-size: 10px; color: var(--faint); }
.slot .small { display: inline-flex; }
.meaning { margin-top: 8px; font-weight: 600; font-size: 14px; }
.where { font-size: 12px; color: var(--muted); line-height: 1.5; }
@media (max-width: 760px) {
  .refs, .compare { grid-template-columns: 1fr; }
  .set[data-set="reeder"] h3::after { content: ""; }
}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>Reeder 式图标 · 候选方案</h1>
    <p class="lede">参考 Reeder 截图画的一整套，{{COUNT}} 个图标，和 App 里现在的第七轮「瑞士几何」同名同用处，选中后可以整套替换。颜色按 App 实际的图标灰（浅 #5E5E5E / 深 #A8A8A8）。</p>
  </div>
  <div class="toggle" role="group" aria-label="主题">
    <button data-t="auto" aria-pressed="true">跟随系统</button><button data-t="light" aria-pressed="false">浅色</button><button data-t="dark" aria-pressed="false">深色</button>
  </div>
</header>

<h2>REEDER 原图（你的截图）</h2>
<div class="refs">
  <div class="strips">{{REFS}}</div>
  <figure><img src="{{SETTINGS_REF}}" alt=""><figcaption>设置分类</figcaption></figure>
</div>
<ul class="rules">{{RULES}}</ul>

<h2>放进真实场景比较</h2>
<div class="compare">{{SETS}}</div>

<h2>逐个比较</h2>
{{GRID}}
</main>
<script>
const root = document.documentElement;
const buttons = document.querySelectorAll('.toggle button');
function apply(t) {
  if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
  try { localStorage.setItem('reeder-icons-theme', t); } catch (e) {}
}
buttons.forEach(b => b.addEventListener('click', () => apply(b.dataset.t)));
try { const t = localStorage.getItem('reeder-icons-theme'); if (t) apply(t); } catch (e) {}
</script>
</body>
</html>
